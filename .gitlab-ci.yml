image: jhipster/jhipster:v8.0.0

cache:
  key: '$CI_COMMIT_REF_NAME'
  paths:
    - .maven/
stages:
  - build
  - test
  - deploy
before_script:
  - export NG_CLI_ANALYTICS="false"
  - export MAVEN_USER_HOME=`pwd`/.maven

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  SPRING_PROFILES_ACTIVE: 'ci'

build-backend:
  stage: build
  image: maven:3.8.8-eclipse-temurin-17
  script:
    - ./mvnw clean install -Pdev -DskipTests
  artifacts:
    paths:
      - target/*.jar
build-frontend:
  stage: build
  image: node:18
  script:
    - npm iinstall
    - npm run test
    - npm run build
  artifacts:
    paths:
      - builds/
test:
  stage: test
  image: maven:3.8.8-eclipse-temurin-17
  script:
    - ./mvnw test
  allow_failure: false

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying application"
    # Add your deployment steps here
  only:
    - main
