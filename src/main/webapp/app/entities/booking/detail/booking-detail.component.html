<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="booking">
      <h2 data-cy="bookingDetailsHeading"><span jhiTranslate="crenoFlowApp.booking.detail.title">Booking</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ booking.id }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.status">Status</span></dt>
        <dd>
          <span jhiTranslate="{{ 'crenoFlowApp.BookingStatus.' + booking.status }}">{{ booking.status }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.bookingDate">Booking Date</span></dt>
        <dd>
          <span>{{ booking.bookingDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.modificationDate">Modification Date</span></dt>
        <dd>
          <span>{{ booking.modificationDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.course">Course</span></dt>
        <dd>
          <div *ngIf="booking.course">
            <a [routerLink]="['/course', booking.course.id, 'view']">{{ booking.course.id }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.parent">Parent</span></dt>
        <dd>
          <div *ngIf="booking.parent">
            <a [routerLink]="['/person', booking.parent.id, 'view']">{{ booking.parent.id }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.booking.student">Student</span></dt>
        <dd>
          <div *ngIf="booking.student">
            <a [routerLink]="['/person', booking.student.id, 'view']">{{ booking.student.id }}</a>
          </div>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/booking', booking.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
