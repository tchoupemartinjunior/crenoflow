<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="course">
      <h2 data-cy="courseDetailsHeading"><span jhiTranslate="crenoFlowApp.course.detail.title">Course</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ course.id }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.teachersComment">Teachers Comment</span></dt>
        <dd>
          <span>{{ course.teachersComment }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.subject">Subject</span></dt>
        <dd>
          <div *ngIf="course.subject">
            <a [routerLink]="['/subject', course.subject.id, 'view']">{{ course.subject.label }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.cycle">Cycle</span></dt>
        <dd>
          <div *ngIf="course.cycle">
            <a [routerLink]="['/cycle', course.cycle.id, 'view']">{{ course.cycle.label }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.location">Location</span></dt>
        <dd>
          <div *ngIf="course.location">
            <a [routerLink]="['/course-location', course.location.id, 'view']">{{ course.location.id }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.teacher">Teacher</span></dt>
        <dd>
          <div *ngIf="course.teacher">
            <a [routerLink]="['/teacher', course.teacher.id, 'view']">{{ course.teacher.id }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.course.availability">Availability</span></dt>
        <dd>
          <div *ngIf="course.availability">
            <a [routerLink]="['/availability', course.availability.id, 'view']">{{ course.availability.id }}</a>
          </div>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/course', course.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
