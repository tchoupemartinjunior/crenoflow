<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-course-heading" data-cy="CourseCreateUpdateHeading" jhiTranslate="crenoFlowApp.course.home.createOrEditLabel">
        Créer ou éditer un Course
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.teachersComment" for="field_teachersComment">Teachers Comment</label>
          <input
            type="text"
            class="form-control"
            name="teachersComment"
            id="field_teachersComment"
            data-cy="teachersComment"
            formControlName="teachersComment"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.subject" for="field_subject">Subject</label>
          <select
            class="form-control"
            id="field_subject"
            data-cy="subject"
            name="subject"
            formControlName="subject"
            [compareWith]="compareSubject"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="subjectOption" *ngFor="let subjectOption of subjectsSharedCollection">{{ subjectOption.label }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.cycle" for="field_cycle">Cycle</label>
          <select class="form-control" id="field_cycle" data-cy="cycle" name="cycle" formControlName="cycle" [compareWith]="compareCycle">
            <option [ngValue]="null"></option>
            <option [ngValue]="cycleOption" *ngFor="let cycleOption of cyclesSharedCollection">{{ cycleOption.label }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.location" for="field_location">Location</label>
          <select
            class="form-control"
            id="field_location"
            data-cy="location"
            name="location"
            formControlName="location"
            [compareWith]="compareCourseLocation"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="courseLocationOption" *ngFor="let courseLocationOption of courseLocationsSharedCollection">
              {{ courseLocationOption.id }}
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.teacher" for="field_teacher">Teacher</label>
          <select
            class="form-control"
            id="field_teacher"
            data-cy="teacher"
            name="teacher"
            formControlName="teacher"
            [compareWith]="compareTeacher"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="teacherOption" *ngFor="let teacherOption of teachersSharedCollection">{{ teacherOption.id }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.course.availability" for="field_availability">Availability</label>
          <select
            class="form-control"
            id="field_availability"
            data-cy="availability"
            name="availability"
            formControlName="availability"
            [compareWith]="compareAvailability"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="availabilityOption" *ngFor="let availabilityOption of availabilitiesSharedCollection">
              {{ availabilityOption.id }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
