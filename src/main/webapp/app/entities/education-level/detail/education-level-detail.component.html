<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="educationLevel">
      <h2 data-cy="educationLevelDetailsHeading"><span jhiTranslate="crenoFlowApp.educationLevel.detail.title">Education Level</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ educationLevel.id }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.educationLevel.label">Label</span></dt>
        <dd>
          <span>{{ educationLevel.label }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/education-level', educationLevel.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
