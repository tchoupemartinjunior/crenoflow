<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="subject">
      <h2 data-cy="subjectDetailsHeading"><span jhiTranslate="crenoFlowApp.subject.detail.title">Subject</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ subject.id }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.subject.label">Label</span></dt>
        <dd>
          <span>{{ subject.label }}</span>
        </dd>
        <dt><span jhiTranslate="crenoFlowApp.subject.subjectCycle">Subject Cycle</span></dt>
        <dd>
          <span *ngFor="let subjectCycle of subject.subjectCycles; let last = last">
            <a [routerLink]="['/subject-cycle', subjectCycle.id, 'view']">{{ subjectCycle.id }}</a
            >{{ last ? '' : ', ' }}
          </span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/subject', subject.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
