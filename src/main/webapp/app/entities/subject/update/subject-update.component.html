<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-subject-heading" data-cy="SubjectCreateUpdateHeading" jhiTranslate="crenoFlowApp.subject.home.createOrEditLabel">
        Créer ou éditer un Subject
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="crenoFlowApp.subject.label" for="field_label">Label</label>
          <input type="text" class="form-control" name="label" id="field_label" data-cy="label" formControlName="label" />
          <div *ngIf="editForm.get('label')!.invalid && (editForm.get('label')!.dirty || editForm.get('label')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('label')?.errors?.required" jhiTranslate="entity.validation.required"
              >Ce champ est obligatoire.</small
            >
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('label')?.errors?.minlength"
              jhiTranslate="entity.validation.minlength"
              [translateValues]="{ min: 1 }"
              >Ce champ doit faire au minimum 1 caractères.</small
            >
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('label')?.errors?.maxlength"
              jhiTranslate="entity.validation.maxlength"
              [translateValues]="{ max: 64 }"
              >Ce champ doit faire moins de 64 caractères.</small
            >
          </div>
        </div>

        <div class="mb-3">
          <label jhiTranslate="crenoFlowApp.subject.subjectCycle" for="field_subjectCycles">Subject Cycle</label>
          <select
            class="form-control"
            id="field_subjectCycles"
            data-cy="subjectCycle"
            multiple
            name="subjectCycles"
            formControlName="subjectCycles"
            [compareWith]="compareSubjectCycle"
          >
            <option [ngValue]="subjectCycleOption" *ngFor="let subjectCycleOption of subjectCyclesSharedCollection">
              {{ subjectCycleOption.id }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
