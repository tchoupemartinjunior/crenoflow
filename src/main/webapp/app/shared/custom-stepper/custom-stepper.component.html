<div class="stepper d-flex justify-content-between my-3">
  <ng-container *ngFor="let step of steps; let i = index">
    <div class="step" [ngClass]="{ active: selectedIndex === i, completed: selectedIndex > i }">
      <div class="step-circle">{{ i }}</div>
      <p class="step-label">{{ step.label }}</p>
    </div>
    <div class="step-line" *ngIf="i < steps.length - 1"></div>
  </ng-container>
</div>

<div *ngIf="selected" class="col-12 p-3 col-lg-8 mx-md-auto mx-2 mt-2 shadow p-md-5 pt-2 bg-white rounded">
  <ng-container [ngTemplateOutlet]="selected.content"></ng-container>
  <div class="mt-4 d-flex" [ngClass]="{ 'justify-content-between': selectedIndex > 0, 'justify-content-end': selectedIndex === 0 }">
    <button *ngIf="selectedIndex > 0" class="btn btn-outline-secondary" (click)="previousStep()">Précédent</button>
    <button type="submit" [disabled]="selected.state !== 'done'" class="btn btn-primary" (click)="nextStep()">
      {{ selectedIndex === steps.length - 1 ? 'Terminer' : 'Suivant' }}
    </button>
  </div>
</div>
