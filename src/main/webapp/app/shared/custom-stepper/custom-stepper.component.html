<div class="container mt-4">
  <!-- Stepper Header -->
  <div class="stepper d-flex justify-content-between my-3">
    <!-- <div class="step completed">
        <div class="step-circle">1</div>
        <p class="step-label">Information</p>
      </div>
      <div class="step-line completed"></div>
      <div class="step active">
        <div class="step-circle">2</div>
        <p class="step-label">Contact</p>
      </div> -->

    <ng-container *ngFor="let step of steps; let i = index">
      <div class="step" [ngClass]="{ active: selectedIndex === i, inactive: selectedIndex !== i }">
        <div class="step-circle">{{ i }}</div>
        <p class="step-label">{{ step.label }}</p>
      </div>
      <div class="step-line" *ngIf="i < steps.length - 1"></div>
    </ng-container>
  </div>

  <div *ngIf="selected" class="col-md-8 mx-auto mt-2 shadow p-5 pt-2 bg-white rounded">
    <ng-container [ngTemplateOutlet]="selected.content"></ng-container>
  </div>
</div>
